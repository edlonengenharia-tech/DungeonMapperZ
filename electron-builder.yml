appId: com.dungeonmapper.app
productName: DungeonMapper
copyright: Copyright 2026

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/*.cjs
  - package.json

win:
  target:
    - target: portable
      arch:
        - x64
  artifactName: "${productName}-Portable-${version}.exe"

portable:
  artifactName: "${productName}-Portable-${version}.exe"
